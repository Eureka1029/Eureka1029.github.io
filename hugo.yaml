baseURL: https://eureka1029.github.io/
title: "Eureka'log"
locale: en
timeZone: Asia/Shanghai
theme: PaperMod
enableRobotsTXT: true

frontmatter:
  date: [":date", ":filename", ":default"]

permalinks:
  page:
    blog: /blog/:year/:slugorcontentbasename/

outputFormats:
  rss:
    baseName: feed

outputs:
  home: [html, rss, json]

markup:
  highlight:
    noClasses: false

params:
  author: Eureka
  description: Eureka's learning notes since 2026.
  mainSections: [blog]
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false

  assets:
    favicon: favicon.png

  homeInfoParams:
    title: "👋 Welcome to Eureka’Log"
    content: "Hi, this is Eureka. I’m documenting my learning notes in this blog since 2026."

  socialIcons:
    - name: bilibili
      title: Bilibili
      url: https://space.bilibili.com/326517598
    - name: email
      title: Email
      url: mailto:1285523226@qq.com

menus:
  main:
    - name: Posts
      pageRef: /
      weight: 10
    - name: Archive
      pageRef: /archives
      weight: 20
    - name: Search
      pageRef: /search
      weight: 30
    - name: Tags
      pageRef: /tags
      weight: 40
    - name: About
      pageRef: /about
      weight: 50
