title: YongHao Ning
description: YongHao Ning's academic homepage, projects, and technical notes.
url: https://eureka1029.github.io
baseurl: ""
lang: en
timezone: Asia/Shanghai

markdown: kramdown
kramdown:
  input: GFM
permalink: /blog/:year/:title/
plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-sitemap

collections:
  publications:
    output: false
  news:
    output: false
  showcase:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: blog_post
      navbar_title: Blog

exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .obsidian/
  - .tools/
  - _verification/
  - bin/
  - docs/
  - templates/
  - vendor/
  - node_modules/
